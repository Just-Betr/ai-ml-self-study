[project]
name = "ai-ml-self-study"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "mlflow>=3.17.1",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "jupyterlab>=4.6.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests", "01-pulse", "02-pulse-service", "03-carescribe", "04-resolve", "05-atlas"]
